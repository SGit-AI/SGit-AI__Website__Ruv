<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Policy Gate</title>
<style>
  :root { --bg:#070b14; --ink:#e2e8f0; --muted:#94a3b8; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display:block; width:100vw; height:100vh; }
  #corner { position:fixed; left:12px; bottom:10px; right:12px; font-size:12px; color:var(--muted);
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; pointer-events:none; }
  #corner a { color:#2dd4bf; text-decoration:none; pointer-events:auto; }
  #corner a:hover { text-decoration:underline; }
  #err { position:fixed; inset:0; display:none; place-items:center; color:#f87171; padding:16px; text-align:center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="corner"><span>v4 · The policy gate · made in the ruv.sgit.ai studio run</span><a href="../index.html">← studio</a></div>
<div id="err"></div>
<script src="../../assets/clock.js"></script>
<script>
(() => {
  const LOOP = 36;
  const t0 = performance.now();
  window.__t = () => ruvLoop((performance.now() - t0) / 1000, LOOP, 34);

  const C = { green:'#4ade80', teal:'#2dd4bf', red:'#f87171', amber:'#fbbf24', ink:'#e2e8f0', muted:'#94a3b8', dim:'#334155', panel:'#0f172a' };
  const AGENT_COLS = ['#60a5fa','#a78bfa','#f472b6','#f59e0b','#34d399','#94a3b8'];
  const ROUNDS = [
    { key:'legacy', title:'Round 1 · Ruflo default (legacy)', start:1.5, gap:0.85, end:15.5 },
    { key:'abp',    title:'Round 2 · with the ABP (enforce)', start:17.5, gap:1.05, end:LOOP }
  ];
  const FLIGHT = 2.2;

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W = 0, H = 0, data = null, rows = [], agents = [];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  const parse = s => { const m = /^(\S+)\s*\((.*)\)\s*$/.exec(s || ''); return m ? { d:m[1], why:m[2] } : { d:(s||'').trim(), why:'' }; };
  const rnd = seed => { let x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); };
  const ease = p => p < 0 ? 0 : p > 1 ? 1 : (p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2);
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

  fetch('../../data/report.json').then(r => { if (!r.ok) throw new Error('report.json ' + r.status); return r.json(); })
    .then(j => { data = j; setup(); requestAnimationFrame(frame); })
    .catch(e => { const el = document.getElementById('err'); el.style.display = 'grid'; el.textContent = 'Could not load report.json: ' + e.message; });

  function setup() {
    rows = data.rows.map((r, i) => ({ i, who:r.who, action:r.action, resource:r.resource,
      legacy:parse(r.legacy), abp:parse(r.abp) }));
    const seen = [];
    rows.forEach(r => { if (!seen.includes(r.who)) seen.push(r.who); });
    agents = seen.map((w, k) => ({ who:w, col:AGENT_COLS[k % AGENT_COLS.length], k }));
    rows.forEach(r => r.agent = agents.find(a => a.who === r.who));
  }

  // ---------- layout ----------
  function layout() {
    const portrait = W < H * 0.9 || W < 700;
    const L = { portrait };
    if (!portrait) {
      L.headH = 96; L.fTop = 120; L.fBot = H * 0.62; L.rTop = H * 0.68; L.rBot = H - 48;
      L.agentX = W * 0.09; L.gateX = W * 0.52; L.exitX = W * 0.95;
      L.agentPt = a => ({ x:L.agentX, y:L.fTop + (L.fBot - L.fTop - 70) * (a.k + .5) / agents.length });
      L.lanePt = i => ({ x:L.gateX, y:L.fTop + 10 + (L.fBot - L.fTop - 90) * (i + .5) / rows.length });
      L.exitPt = (i, p) => ({ x:L.gateX + (L.exitX - L.gateX) * p, y:L.lanePt(i).y });
      L.bay = { x:W * 0.58, y:L.fBot - 64, w:W * 0.34, h:58 };
      L.gateSeg = [{ x:L.gateX, y:L.fTop - 6 }, { x:L.gateX, y:L.fBot - 76 }];
      L.font = 13;
    } else {
      L.headH = 92; L.fTop = 120; L.fBot = H * 0.56; L.rTop = H * 0.585; L.rBot = H - 80;
      const lw = W * 0.64;
      L.agentPt = a => ({ x:16 + (W - 32) * (a.k + .5) / agents.length, y:L.fTop + 6 });
      L.gateY = L.fTop + (L.fBot - L.fTop) * 0.5;
      L.lanePt = i => ({ x:14 + (lw - 14) * (i + .5) / rows.length, y:L.gateY });
      L.exitPt = (i, p) => ({ x:L.lanePt(i).x, y:L.gateY + (L.fBot - 10 - L.gateY) * p });
      L.bay = { x:lw + 10, y:L.gateY + 8, w:W - lw - 18, h:L.fBot - L.gateY - 14 };
      L.gateSeg = [{ x:10, y:L.gateY }, { x:lw + 4, y:L.gateY }];
      L.font = 10;
    }
    return L;
  }

  function bayPt(L, slot) {
    const b = L.bay;
    if (!L.portrait) return { x:b.x + 50 + slot * 150, y:b.y + b.h - 18 };
    return { x:b.x + b.w / 2, y:b.y + 44 + slot * 46 };
  }

  // ---------- timing ----------
  function roundAt(t) { return t < ROUNDS[0].end ? 0 : 1; }
  const launchT = (R, i) => R.start + i * R.gap;
  const arriveT = (R, i) => launchT(R, i) + FLIGHT;
  const dec = (r, ri) => (ri === 0 ? r.legacy : r.abp);
  const colFor = (d, ri) => d === 'denied' ? C.red : d === 'approval_required' ? C.amber : (ri === 0 ? C.green : C.teal);
  const word = d => d === 'approval_required' ? 'held' : d;

  // ---------- drawing helpers ----------
  function glowDot(x, y, r, col, a = 1) {
    ctx.save(); ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
    g.addColorStop(0, col); g.addColorStop(.35, col + '88'); g.addColorStop(1, col + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r * .45, 0, 7); ctx.fill();
    ctx.restore();
  }
  function text(s, x, y, { size = 13, col = C.ink, align = 'left', weight = 400, base = 'alphabetic', a = 1, mono = false } = {}) {
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = base;
    ctx.font = `${weight} ${size}px ${mono ? 'ui-monospace, SFMono-Regular, Menlo, monospace' : 'ui-sans-serif, system-ui, sans-serif'}`;
    ctx.fillText(s, x, y); ctx.restore();
  }
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  function fit(s, max, size, mono) { ctx.font = `400 ${size}px ${mono ? 'ui-monospace, SFMono-Regular, Menlo, monospace' : 'ui-sans-serif, system-ui, sans-serif'}`; if (ctx.measureText(s).width <= max) return s;
    while (s.length > 2 && ctx.measureText(s + '…').width > max) s = s.slice(0, -1); return s + '…'; }

  // ---------- frame ----------
  function frame() {
    const t = window.__t();
    const L = layout();
    ctx.fillStyle = '#070b14'; ctx.fillRect(0, 0, W, H);
    // subtle grid
    ctx.save(); ctx.strokeStyle = '#0f1a2e'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.restore();

    const ri = roundAt(t), R = ROUNDS[ri];
    drawHeader(L, t, ri);
    drawAgents(L, t, ri);
    drawGate(L, t, ri);
    drawBay(L, t, ri);
    drawParticles(L, t, ri);
    drawReceipts(L, t, ri);
    if (ri === 1 && t < ROUNDS[1].start) drawInterlude(L, t);
    requestAnimationFrame(frame);
  }

  function counts(t, ri) {
    const R = ROUNDS[ri], c = { allowed:0, denied:0, approval_required:0 }, tot = { allowed:0, denied:0, approval_required:0 };
    rows.forEach(r => { const d = dec(r, ri).d; tot[d] = (tot[d] || 0) + 1; if (t >= arriveT(R, r.i)) c[d] = (c[d] || 0) + 1; });
    return { c, tot };
  }

  function drawHeader(L, t, ri) {
    const R = ROUNDS[ri], P = L.portrait, n = rows.length;
    text(R.title, 16, P ? 26 : 40, { size:P ? 17 : 26, weight:700, col: ri === 0 ? C.green : C.teal });
    text(P ? `${data.deployment.split(' (')[0]} · ${n} actions` : `${data.deployment} · the same ${n} actions, twice`, 16, P ? 46 : 66, { size:P ? 11 : 14, col:C.muted });
    // scoreboard
    const legacy = counts(ri === 0 ? t : LOOP, 0), abp = counts(ri === 1 ? t : -1, 1);
    const lines = [
      { lab:'Ruflo default', parts:[[`allowed ${legacy.c.allowed} / ${n}`, C.green]], on: true },
      { lab:'with the ABP', parts:[[`denied ${abp.c.denied}`, C.red], [`held ${abp.c.approval_required}`, C.amber], [`allowed ${abp.c.allowed}`, C.teal]], on: ri === 1 }
    ];
    const sz = P ? 11 : 14;
    lines.forEach((ln, k) => {
      const y = P ? 66 + k * 17 : 34 + k * 26;
      let x = P ? 16 : W - 470;
      text(ln.lab, x, y, { size:sz, col:C.muted, a: ln.on ? 1 : .45 }); x += P ? 92 : 130;
      ln.parts.forEach(([s, col]) => { text(s, x, y, { size:sz, weight:700, col, a: ln.on ? 1 : .35, mono:true }); ctx.font = `700 ${sz}px ui-monospace, monospace`; x += ctx.measureText(s).width + (P ? 10 : 18); });
    });
  }

  function drawAgents(L, t, ri) {
    agents.forEach(a => {
      const p = L.agentPt(a);
      ctx.save(); ctx.strokeStyle = a.col; ctx.lineWidth = 2; ctx.fillStyle = C.panel;
      ctx.beginPath(); ctx.arc(p.x, p.y, L.portrait ? 9 : 14, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
      glowDot(p.x, p.y, L.portrait ? 2.5 : 3.5, a.col, .9);
      if (L.portrait) text(fit(a.who, (W - 32) / agents.length - 2, 9), p.x, p.y - 15, { size:9, col:a.col, align:'center' });
      else text(a.who, p.x - 22, p.y + 4, { size:13, col:a.col, align:'right', weight:600 });
    });
  }

  function gateFlash(t, ri) {
    const R = ROUNDS[ri]; let best = null;
    rows.forEach(r => { const dt = t - arriveT(R, r.i); if (dt >= 0 && dt < .6) best = { r, dt }; });
    return best;
  }

  function drawGate(L, t, ri) {
    const [a, b] = L.gateSeg, f = gateFlash(t, ri);
    const col = ri === 0 ? C.green : (f ? colFor(f.r.abp.d, 1) : '#475569');
    ctx.save();
    ctx.lineCap = 'round';
    if (ri === 0) { ctx.setLineDash([6, 10]); ctx.strokeStyle = C.green + '88'; ctx.lineWidth = 3; }
    else { ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.shadowColor = col; ctx.shadowBlur = f ? 30 * (1 - f.dt / .6) + 8 : 10; }
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.restore();
    const lab = ri === 0 ? 'gate: allow-all (legacy-default-allow)' : 'gate: ABP · enforce';
    if (L.portrait) text(lab, a.x, a.y - 8, { size:10, col: ri === 0 ? C.green : C.ink, weight:600 });
    else text(lab, a.x, a.y - 12, { size:13, col: ri === 0 ? C.green : C.ink, weight:600, align:'center' });
    // last decision reason
    let last = null; const R = ROUNDS[ri];
    rows.forEach(r => { if (t >= arriveT(R, r.i)) last = r; });
    if (last) {
      const d = dec(last, ri), s = `${last.who} ${last.action}${last.resource ? ' ' + last.resource : ''} → ${d.why || d.d}`;
      if (L.portrait) text(fit(s, W - 32, 10, true), 16, L.fBot + 2, { size:10, col:colFor(d.d, ri), mono:true });
      else text(s, L.gateX + 24, L.fTop + 14, { size:13, col:colFor(d.d, ri), mono:true });
    }
  }

  function drawBay(L, t, ri) {
    if (ri !== 1) return;
    const b = L.bay;
    ctx.save(); ctx.setLineDash([4, 6]); ctx.strokeStyle = C.amber + '99'; ctx.lineWidth = 1.5; ctx.fillStyle = C.amber + '10';
    rrect(b.x, b.y, b.w, b.h, 8); ctx.fill(); ctx.stroke(); ctx.restore();
    if (L.portrait) { text('waiting for', b.x + 6, b.y + 14, { size:9, col:C.amber }); text('approval: ' , b.x + 6, b.y + 25, { size:9, col:C.amber }); text(fit(data.owner, b.w - 10, 9), b.x + 6, b.y + 36, { size:9, col:C.amber, weight:700 }); }
    else text(`waiting for approval · ${data.owner}`, b.x + 10, b.y + 16, { size:12, col:C.amber, weight:600 });
  }

  function drawParticles(L, t, ri) {
    const R = ROUNDS[ri]; let slot = 0;
    const lsz = L.portrait ? 9 : 12;
    rows.forEach(r => {
      const d = dec(r, ri).d, col = colFor(d, ri), lt = launchT(R, r.i), at = arriveT(R, r.i);
      const isHeld = d === 'approval_required', mySlot = isHeld ? slot++ : -1;
      if (t < lt) return;
      const s = L.agentPt(r.agent), g = L.lanePt(r.i);
      if (t < at) {
        const p = ease((t - lt) / FLIGHT);
        const cx = L.portrait ? g.x : (s.x + g.x) / 2, cy = L.portrait ? (s.y + g.y) / 2 : s.y;
        const x = (1-p)*(1-p)*s.x + 2*(1-p)*p*cx + p*p*g.x, y = (1-p)*(1-p)*s.y + 2*(1-p)*p*cy + p*p*g.y;
        // trail
        for (let k = 1; k <= 6; k++) { const q = ease((t - lt - k * .035) / FLIGHT); if (q <= 0) break;
          const tx = (1-q)*(1-q)*s.x + 2*(1-q)*q*cx + q*q*g.x, ty = (1-q)*(1-q)*s.y + 2*(1-q)*q*cy + q*q*g.y;
          glowDot(tx, ty, (L.portrait ? 3 : 4) * (1 - k / 8), r.agent.col, .25); }
        glowDot(x, y, L.portrait ? 3.5 : 5, r.agent.col);
        if (L.portrait) text(r.action, x + 6, y - 6, { size:lsz, col:C.ink, mono:true });
        else text(r.action, x + 10, y - 10, { size:lsz, col:C.ink, mono:true });
        return;
      }
      const dt = t - at;
      if (d === 'denied') {
        if (dt > 1.6) return;
        const a = 1 - dt / 1.6;
        for (let k = 0; k < 16; k++) {
          const ang = rnd(r.i * 31 + k) * Math.PI * 2, sp = 40 + rnd(r.i * 17 + k * 3) * 90;
          const bx = L.portrait ? 0 : -1, by = L.portrait ? -1 : 0;
          const x = g.x + (Math.cos(ang) * sp + bx * 50) * dt, y = g.y + (Math.sin(ang) * sp + by * 50) * dt + 60 * dt * dt;
          ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.red; ctx.translate(x, y); ctx.rotate(ang + dt * 6);
          ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(3, 3); ctx.lineTo(-3, 2); ctx.closePath(); ctx.fill(); ctx.restore();
        }
        if (dt < .5) glowDot(g.x, g.y, 9 * (1 - dt / .5) + 2, C.red, 1 - dt / .5);
        text('✕ ' + r.action, g.x + (L.portrait ? 6 : -10), g.y + (L.portrait ? -8 : 4), { size:lsz, col:C.red, align: L.portrait ? 'left' : 'right', weight:700, a, mono:true });
      } else if (isHeld) {
        const e = bayPt(L, mySlot), p = ease(dt / .9);
        const x = g.x + (e.x - g.x) * p, y = g.y + (e.y - g.y) * p;
        const pulse = .65 + .35 * Math.sin(t * 4 + r.i);
        glowDot(x, y, (L.portrait ? 4 : 6) * (p < 1 ? 1 : pulse + .2), C.amber);
        if (L.portrait) { text(r.who, x, y + 14, { size:8, col:C.muted, align:'center', a:p }); text(fit(r.action, L.bay.w - 6, 9), x, y + 25, { size:9, col:C.amber, align:'center', mono:true, a:p }); }
        else text(`${r.who} ${r.action}`, x + 12, y + 4, { size:lsz, col:C.amber, mono:true, a:p });
      } else {
        const p = clamp(dt / 1.4, 0, 1), e = L.exitPt(r.i, ease(p));
        if (p >= 1) return;
        glowDot(e.x, e.y, L.portrait ? 3.5 : 5, col, 1 - p * p);
        if (L.portrait) text(r.action, e.x + 6, e.y + 4, { size:lsz, col, mono:true, a:1 - p });
        else text('✓ ' + r.action, e.x + 10, e.y + 4, { size:lsz, col, mono:true, a:1 - p });
      }
    });
  }

  function receiptRect(L, i) {
    const n = rows.length;
    if (!L.portrait) {
      const gap = 18, w = (W - 32 - gap * (n - 1)) / n, h = Math.min(92, L.rBot - L.rTop - 60);
      return { x:16 + i * (w + gap), y:L.rTop + 30, w, h };
    }
    const cols = 4, gap = 12, w = (W - 32 - gap * (cols - 1)) / cols, rowI = Math.floor(i / cols);
    const col = rowI % 2 === 0 ? i % cols : cols - 1 - (i % cols);  // snake so the chain stays short
    const h = Math.min(58, (L.rBot - L.rTop - 70) / Math.ceil(n / cols) - 12);
    return { x:16 + col * (w + gap), y:L.rTop + 26 + rowI * (h + 14), w, h };
  }

  function drawReceipts(L, t, ri) {
    const R = ROUNDS[ri], key = R.key, led = data.ledger[key];
    text(`receipts · hash-chained ledger (${key})`, 16, L.rTop + (L.portrait ? 12 : 14), { size:L.portrait ? 11 : 13, col:C.muted, weight:600 });
    let dropped = 0, prev = null;
    rows.forEach(r => {
      const appear = arriveT(R, r.i) + .2; if (t < appear) return;
      dropped++;
      const d = dec(r, ri), col = colFor(d.d, ri), q = ease((t - appear) / .5), rc = receiptRect(L, r.i);
      const y = rc.y - (1 - q) * 40;
      // chain link to previous receipt
      if (prev) {
        const lq = clamp((t - appear - .3) / .4, 0, 1);
        if (lq > 0) {
          let ax, ay, bx, by;
          if (L.portrait && Math.abs(prev.y - rc.y) > 2) { ax = prev.x + prev.w / 2; ay = prev.y + prev.h; bx = rc.x + rc.w / 2; by = rc.y; }
          else { const lr = rc.x > prev.x; ax = lr ? prev.x + prev.w : prev.x; ay = prev.y + prev.h / 2; bx = lr ? rc.x : rc.x + rc.w; by = rc.y + rc.h / 2; }
          const mx = ax + (bx - ax) * lq, my = ay + (by - ay) * lq;
          ctx.save(); ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(mx, my); ctx.stroke();
          if (lq >= 1) { const cx = (ax + bx) / 2, cy = (ay + by) / 2, vert = Math.abs(by - ay) > Math.abs(bx - ax);
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1.6;
            ctx.beginPath(); ctx.ellipse(cx + (vert ? 0 : -3), cy + (vert ? -3 : 0), vert ? 2.5 : 4.5, vert ? 4.5 : 2.5, 0, 0, 7); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(cx + (vert ? 0 : 3), cy + (vert ? 3 : 0), vert ? 2.5 : 4.5, vert ? 4.5 : 2.5, 0, 0, 7); ctx.stroke(); }
          ctx.restore();
        }
      }
      prev = rc;
      ctx.save(); ctx.globalAlpha = q; ctx.fillStyle = C.panel; ctx.strokeStyle = col + 'cc'; ctx.lineWidth = 1.5;
      ctx.shadowColor = col; ctx.shadowBlur = (1 - q) * 20 + 4;
      rrect(rc.x, y, rc.w, rc.h, 6); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
      ctx.fillStyle = col; ctx.fillRect(rc.x, y + 6, 3, rc.h - 12); ctx.restore();
      const P = L.portrait, pad = P ? 6 : 10;
      text(`#${r.i + 1}`, rc.x + pad, y + (P ? 13 : 20), { size:P ? 9 : 12, col:C.muted, mono:true, a:q });
      text(fit(r.who, rc.w - pad * 2 - (P ? 18 : 26), P ? 9 : 11), rc.x + pad + (P ? 18 : 28), y + (P ? 13 : 20), { size:P ? 9 : 11, col:r.agent.col, a:q });
      text(fit(r.action, rc.w - pad * 2, P ? 9 : 12, true), rc.x + pad, y + (P ? 27 : 42), { size:P ? 9 : 12, col:C.ink, mono:true, a:q });
      text(word(d.d), rc.x + pad, y + (P ? 41 : 62), { size:P ? 10 : 13, col, weight:700, a:q });
      if (!P) text(r.i === 0 ? 'genesis' : `prev → #${r.i}`, rc.x + pad, y + 80, { size:10, col:'#64748b', mono:true, a:q });
    });
    if (dropped === rows.length) {
      const a = clamp((t - arriveT(R, rows.length - 1) - 1.2) / .6, 0, 1);
      if (a > 0) {
        const lastRc = receiptRect(L, rows.length - 1), y = L.portrait ? L.rBot + 2 : lastRc.y + lastRc.h + 36;
        const s = `${led.valid ? 'ledger valid' : 'ledger INVALID'} · ${led.length} receipts`;
        text(s, L.portrait ? 16 : W / 2, y, { size:L.portrait ? 14 : 20, weight:700, col: led.valid ? C.teal : C.red, align: L.portrait ? 'left' : 'center', a });
      }
    }
  }

  function drawInterlude(L, t) {
    const R = ROUNDS[1], a = clamp(Math.min(t - ROUNDS[0].end, R.start - t) / .4, 0, 1), n = rows.length;
    const tot = counts(LOOP, 1).tot;
    ctx.save(); ctx.globalAlpha = a * .85; ctx.fillStyle = '#070b14'; ctx.fillRect(0, 0, W, H); ctx.restore();
    const P = L.portrait, cy = H * .42;
    text('Round 2', W / 2, cy - (P ? 34 : 50), { size:P ? 14 : 18, col:C.muted, align:'center', a });
    text(`the same ${n} actions, with the ABP (enforce)`, W / 2, cy, { size:P ? 16 : 30, weight:700, col:C.teal, align:'center', a });
    text(`Ruflo default let ${counts(LOOP, 0).c.allowed} of ${n} through`, W / 2, cy + (P ? 28 : 44), { size:P ? 12 : 16, col:C.green, align:'center', a });
    text(`owner: ${data.owner}`, W / 2, cy + (P ? 48 : 72), { size:P ? 11 : 14, col:C.muted, align:'center', a });
  }
})();
</script>
