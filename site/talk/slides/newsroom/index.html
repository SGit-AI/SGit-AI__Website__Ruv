<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>newsroom.sgit.ai, its views</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../assets/themes.css">
<script src="../../../assets/theme.js"></script>
<script src="../../../assets/clock.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:1280px;height:600px;transform-origin:0 0;padding:18px 34px}
h1{margin:0 0 12px;font:700 26px/1.2 system-ui,sans-serif;color:var(--head)} h1 b{color:var(--accent)} h1 span{font:500 17px system-ui,sans-serif;color:var(--dim);margin-left:10px}
.g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 16px}
figure{margin:0}
.sh{height:196px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sh img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.sh.phone{display:flex;justify-content:center;background:var(--panel)} .sh.phone img{width:auto;height:100%;object-fit:contain;border-left:1px solid var(--line);border-right:1px solid var(--line)}
figcaption{font:600 16px system-ui,sans-serif;color:var(--head);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} figcaption span{font:500 13px ui-monospace,Menlo,monospace;color:var(--dim);margin-left:6px}
#ft{position:absolute;left:34px;right:34px;bottom:12px;font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<div id="cv">
<h1><b>newsroom.sgit.ai</b> one newsroom, many ways to read it <span>the same sgit vaults, the same articles</span></h1>
<div class="g" id="g"></div>
<div id="ft">Screenshots of newsroom.sgit.ai taken live with Playwright on 15 Oct 2026 (1280 px wide; the last at phone width). A still: no animation.</div>
</div>
<script>
var S = [['nr-front', 'the front page', '/'], ['nr-article', 'an article', '/articles/the-scripted-talk'], ['nr-ways', 'ways to read one article', '/articles/ways-to-read…'],
  ['nr-graph', 'the wire as a graph', '/articles/the-wire-as-a-graph'], ['nr-desk', 'the desk', '/articles/desk'], ['nr-newsletter', 'the newsletter', '/articles/newsletter'],
  ['nr-collections', 'collections', '/articles/collections'], ['nr-phone', 'on a phone', '390 px']];
document.getElementById('g').innerHTML = S.map(function (s) { return '<figure><div class="sh' + (s[0] === 'nr-phone' ? ' phone' : '') + '"><img alt="' + s[1] + '" src="../../../assets/img/talk/' + s[0] + '.webp"></div><figcaption>' + s[1] + '<span>' + s[2] + '</span></figcaption></figure>'; }).join('');
function fit() { var w = innerWidth, h = innerHeight, k = Math.min(w / 1280, h / 600), cv = document.getElementById('cv'); cv.style.transform = 'scale(' + k + ')'; cv.style.left = Math.max(0, (w - 1280 * k) / 2) + 'px'; cv.style.top = Math.max(0, (h - 600 * k) / 2) + 'px'; }
addEventListener('resize', fit); fit();
window.RUV_STEPS = [{ t: 0, label: 'the newsroom, its views' }];
</script>
</body>
</html>
